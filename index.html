<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#294f3f">
  <link rel="icon" type="image/svg+xml" href="assets/icon-camping.svg">
  <link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32.png">
  <link rel="apple-touch-icon" sizes="180x180" href="assets/apple-touch-icon.png">
  <link rel="manifest" href="site.webmanifest">
  <title>Camping Map v22.3.24 mobile UI cleanup</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <style>
:root {
  --bg: #edf1ea; --panel: rgba(248,247,241,.97); --panel-border:#c9cfbf; --text:#1c241f; --muted:#5b665d; --accent:#2f5f4a; --accent-2:#6f8f63; --accent-soft:#e5efe8;
  --shadow:0 10px 30px rgba(24,33,27,.18); --radius:16px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;color:var(--text);background:var(--bg)}
body{overflow:hidden}
a{color:#215fcb}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
#app{position:relative;width:100%;height:100%}
#map{position:absolute;inset:0;background:#d7e4d2}
#menuToggle{position:absolute;z-index:1100;top:16px;left:16px;width:46px;height:46px;border-radius:12px;border:1px solid rgba(27,49,36,.15);background:linear-gradient(180deg,#f7fbf8,#edf3ec);box-shadow:var(--shadow)}
#sidebar{position:absolute;z-index:1050;top:16px;left:16px;bottom:16px;width:min(430px,calc(100vw - 32px));background:linear-gradient(180deg,rgba(232,241,233,.98) 0%,rgba(248,247,241,.97) 18%,rgba(248,247,241,.97) 100%);border:1px solid rgba(36,60,46,.14);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;overflow:hidden;transform:translateX(0);transition:transform .2s ease}
#sidebar.closed{transform:translateX(calc(-100% - 22px))}
.sidebar-scroll{overflow:auto;padding:18px 18px 26px;background:linear-gradient(180deg,rgba(255,255,255,.08),rgba(255,255,255,0))}
.panel-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:-18px -18px 14px;padding:18px 18px 16px;background:linear-gradient(135deg,#335f4d 0%,#6f8f63 100%);color:#fff;border-bottom:1px solid rgba(255,255,255,.14)}
.panel-head h1{margin:0;font-size:1.7rem;color:#fff}
.panel-head p{margin:6px 0 0;color:rgba(255,255,255,.88)}
#closeSidebar{border:1px solid rgba(255,255,255,.2);background:rgba(255,255,255,.14);color:#fff;border-radius:10px;width:36px;height:36px}
.section{padding:14px 0 18px;border-top:1px solid #d8ddd2}
.section:first-of-type{border-top:0}
.section h2{margin:0 0 12px;font-size:1.05rem;color:#274634}
.mini-note,.muted{color:var(--muted);font-size:.92rem}
.row{display:flex;gap:8px;align-items:center}
.row.wrap{flex-wrap:wrap}
input[type=text],input[type=url],select,textarea{width:100%;border:1px solid #c8d2c6;background:#fff;color:var(--text);border-radius:12px;padding:10px 12px;box-shadow:inset 0 1px 0 rgba(255,255,255,.6)}
textarea{min-height:90px;resize:vertical}
.primary,.secondary,.chip{border-radius:12px;border:1px solid #b8c8ba;padding:9px 12px;background:#fff}
.primary{background:linear-gradient(180deg,#356a52,#294f3f);color:#fff;border-color:#294f3f}
.chip{padding:6px 10px;font-size:.92rem}
.toggle-grid{display:grid;gap:8px}
.check{display:flex;gap:10px;align-items:center;padding:8px 10px;border:1px solid #d6ddd2;border-radius:12px;background:#fff}
.check.small{padding:7px 10px}
.check input{margin:0}
.check .meta{margin-left:auto;color:var(--muted);font-size:.9rem}
.quick-filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.quick-filters button{border-radius:999px;border:1px solid #bfd0c0;background:#fff;padding:8px 13px}
.quick-filters button.active{background:linear-gradient(180deg,#356a52,#294f3f);color:#fff;border-color:#294f3f}

.field-grid{display:grid;gap:8px}
#draftQueue{min-height:150px}
#statusBar{position:absolute;z-index:900;right:16px;bottom:16px;max-width:min(520px,calc(100vw - 32px));padding:10px 14px;border-radius:12px;background:rgba(27,34,30,.82);color:#fff;box-shadow:var(--shadow)}
#mapReadout{position:absolute;z-index:1150;top:16px;right:16px;padding:11px 13px;border-radius:12px;border:1px solid rgba(34,43,39,.16);background:rgba(251,250,246,.96);box-shadow:var(--shadow);font-size:.93rem;line-height:1.25;min-width:258px}.readout-main{font-weight:600}.readout-mini{font-size:.78rem;color:#5f695f;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mapLoading{position:absolute;z-index:1000;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(243,241,234,.6);color:#19311f;font-weight:600;pointer-events:none}
#mapLoading.hidden{display:none}
.map-legend-panel{position:absolute;z-index:1000;right:16px;left:auto;bottom:76px;max-width:min(360px,calc(100vw - 32px));padding:12px 14px;border-radius:14px;border:1px solid rgba(34,43,39,.16);background:rgba(251,250,246,.96);box-shadow:var(--shadow);font-size:.88rem;line-height:1.25}
.map-legend-panel h3,.legend-mobile summary{margin:0;font-size:.92rem;color:#274634;font-weight:700}
.legend-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px 14px;margin-top:8px}.legend-item{display:flex;align-items:center;gap:8px;min-width:0}.legend-item span:last-child{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend-pin{width:22px;height:22px;flex:0 0 22px;font-size:0}.legend-note{margin-top:8px;color:var(--muted);font-size:.8rem}
.legend-mobile-wrap{display:none}.legend-mobile{border:1px solid #d6ddd2;border-radius:14px;background:#fff;padding:0}.legend-mobile summary{list-style:none;cursor:pointer;padding:12px 14px;display:flex;align-items:center;justify-content:space-between}.legend-mobile summary::-webkit-details-marker{display:none}.legend-mobile[open] summary{border-bottom:1px solid #e0e6de}.legend-mobile-body{padding:10px 12px 12px}
.leaflet-popup-content{margin:12px 14px}.popup-title{font-weight:700;font-size:1rem;margin-bottom:2px}.popup-meta{color:var(--muted);font-size:.9rem;margin-bottom:8px}.popup-grid{display:grid;gap:6px;margin:8px 0}.popup-row{display:grid;grid-template-columns:110px 1fr;gap:8px;align-items:start}.popup-row strong{color:#30473a}.popup-section{margin-top:10px;padding-top:10px;border-top:1px solid #e2e7df}.popup-copy{margin-top:6px;line-height:1.35}.popup-links{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.popup-actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.map-pin{width:24px;height:24px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:2px solid var(--stroke);background:var(--fill);color:var(--icon);box-shadow:0 2px 10px rgba(0,0,0,.14)}
.map-pin svg{width:58%;height:58%;display:block}
.pin-federal-modern{--fill:#2f6f53;--stroke:#245740;--icon:#fff}
.pin-federal-rustic{--fill:#eef8f2;--stroke:#77a98d;--icon:#2f6f53}
.pin-state-modern{--fill:#2d6fd7;--stroke:#255bb2;--icon:#fff}
.pin-state-rustic{--fill:#eef5ff;--stroke:#7ba9ea;--icon:#2d67bc}
.pin-local-modern{--fill:#7b54c7;--stroke:#6542a8;--icon:#fff}
.pin-local-rustic{--fill:#f5efff;--stroke:#ac93dd;--icon:#6d4bbb}
.pin-private-modern{--fill:#d97b1e;--stroke:#b8640f;--icon:#fff}
.pin-private-rustic{--fill:#fff3e5;--stroke:#e2a35f;--icon:#c16a12}
.pin-boondocking{--fill:#e8f6ec;--stroke:#348b45;--icon:#2f7e40}
.pin-info{--fill:#fff8dc;--stroke:#bea03a;--icon:#8b7218}
.pin-draft{--fill:#fff8ea;--stroke:#b58a1e;--icon:#8a6b16}
.pin-corporate-parking{--fill:#f0f6ff;--stroke:#4d7fbf;--icon:#24517f}
.pin-rest-truck{--fill:#f8f2ff;--stroke:#7e59a8;--icon:#5f3d88}
.legend-dot{width:12px;height:12px;border-radius:50%;border:2px solid var(--stroke);background:var(--fill);display:inline-block}.state-badge{display:inline-flex;align-items:center;gap:8px;padding:4px 8px;border-radius:999px;background:#eef3ef;border:1px solid #d5ddd8;font-size:.9rem}.search-results{display:grid;gap:8px;margin-top:10px}.search-result{border:1px solid #d8d1c3;border-radius:12px;background:#fff;padding:10px 12px}

.quick-filters button.partial{background:#edf5ef;border-color:#95b69a;color:#274634}
.dropdown{position:relative}
.dropdown-btn{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:14px;border:1px solid #bfd0c0;background:linear-gradient(180deg,#f8fcf9,#eef5ef);color:#214031;font-weight:600}
.dropdown-btn .summary-note{margin-left:auto;color:#516457;font-weight:500;font-size:.92rem}
.dropdown-btn .caret{font-size:1rem;color:#476353}
.dropdown-panel{margin-top:10px;border:1px solid #cfe0d0;border-radius:16px;background:rgba(255,255,255,.92);box-shadow:0 8px 20px rgba(31,45,35,.08);padding:12px}
.dropdown-panel[hidden]{display:none !important}
#stateSelectMeta:empty,#dataStats:empty{display:none}

@media (max-width:900px){#sidebar{width:min(430px,calc(100vw - 32px))}#mapReadout{top:70px;right:12px;min-width:230px}#mapLegendDesktop{display:none}.legend-mobile-wrap{display:block}.legend-grid{grid-template-columns:1fr}}

/* v22.3.24 mobile UI cleanup
   Keeps the diagnostic Zoom/Cluster/Markers panel from eating the iPhone map. */
@media (max-width:700px){
  #menuToggle{top:max(10px,env(safe-area-inset-top));left:max(10px,env(safe-area-inset-left));width:44px;height:44px;z-index:1250}
  #sidebar{top:max(62px,calc(env(safe-area-inset-top) + 58px));left:max(8px,env(safe-area-inset-left));right:max(8px,env(safe-area-inset-right));bottom:max(8px,env(safe-area-inset-bottom));width:auto;border-radius:16px}
  #sidebar.closed{transform:translateX(calc(-100% - 24px))}
  .sidebar-scroll{padding:14px 14px 22px}
  .panel-head{margin:-14px -14px 12px;padding:14px 14px 12px}
  .panel-head h1{font-size:1.35rem}
  .row{align-items:stretch}
  .row:not(.wrap){flex-direction:column}
  .row.wrap{gap:8px}
  .primary,.secondary,.chip,.quick-filters button{min-height:42px}
  #mapReadout{display:none !important}
  #statusBar{left:8px;right:8px;bottom:max(8px,env(safe-area-inset-bottom));max-width:none;font-size:.88rem;padding:8px 10px}
  .leaflet-control-zoom{margin-top:62px !important}
  .leaflet-popup-content-wrapper{max-width:calc(100vw - 34px)}
  .leaflet-popup-content{max-width:calc(100vw - 62px);max-height:62vh;overflow:auto}
  .popup-row{grid-template-columns:1fr;gap:2px}
}

/* v22.3.24 mobile UI cleanup */
.brand-lockup{display:flex;align-items:center;gap:12px}
.brand-icon{width:54px;height:54px;border-radius:16px;border:2px solid rgba(255,255,255,.5);background:#fff;object-fit:cover;box-shadow:0 6px 14px rgba(0,0,0,.16)}
.panel-head h1{font-size:1.55rem;line-height:1.04;letter-spacing:.02em;text-transform:uppercase}
.panel-head .brand-sub{font-size:.9rem;letter-spacing:.06em;text-transform:uppercase;color:rgba(255,255,255,.86);margin:3px 0 0}
#stateSelectMeta{display:none!important}
#layerMenuPanel .layer-select-all{width:100%;margin-bottom:10px;display:flex;align-items:center;justify-content:center;gap:8px;font-weight:700}
.layer-group-grid{display:grid;gap:8px;margin-bottom:10px}
.layer-group-title{font-size:.82rem;font-weight:800;color:#496053;text-transform:uppercase;letter-spacing:.05em;margin:4px 0 2px}
.layer-icon{width:24px;height:24px;flex:0 0 24px;font-size:0}
.check{min-width:0}.check span:not(.meta){min-width:0}.check .label-text{overflow:hidden;text-overflow:ellipsis;white-space:normal}.check .meta{white-space:nowrap;flex:0 0 auto}
.modal-backdrop{position:absolute;inset:0;z-index:1800;background:rgba(13,20,16,.42);display:none;align-items:center;justify-content:center;padding:16px}
.modal-backdrop.open{display:flex}
.modal-card{width:min(620px,calc(100vw - 24px));max-height:calc(100vh - 32px);overflow:auto;background:var(--panel);border:1px solid var(--panel-border);border-radius:20px;box-shadow:0 22px 70px rgba(0,0,0,.34);padding:16px}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-4px 0 12px}.modal-head h2{margin:0;font-size:1.25rem;color:#243b2d}.modal-close{border:1px solid #cfd8cd;background:#fff;border-radius:12px;width:40px;height:40px;font-size:1.2rem}.modal-card .section{border-top:0;padding:0}.modal-card .section>h2{display:none}
.section-launch{display:grid;gap:8px}.section-launch button{width:100%;display:flex;justify-content:space-between;align-items:center;padding:12px 14px;font-weight:700}
.filter-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.filter-grid label{display:grid;gap:5px;font-size:.86rem;color:#405246}.filter-grid select{padding:9px 10px}.filter-note{font-size:.78rem;color:var(--muted);margin-top:8px}
@media(max-width:700px){.brand-icon{width:46px;height:46px;border-radius:13px}.panel-head h1{font-size:1.15rem}.modal-backdrop{align-items:flex-end;padding:8px}.modal-card{width:100%;max-height:88vh;border-radius:18px 18px 14px 14px}.filter-grid{grid-template-columns:1fr}.check .meta{margin-left:0}.check.small{align-items:flex-start}.check.small input{margin-top:3px}}

  </style>
</head>
<body>
<div id="app">
  <div id="map"></div>
  <div id="mapLoading">Loading map…</div>
  <div id="mapReadout" aria-hidden="true"><div class="readout-main">Zoom -- · Cluster x-- · Markers --/--</div><div class="readout-mini">Loaded --</div></div>
  <div id="mapLegendDesktop" class="map-legend-panel" aria-label="Map legend"></div>
  <button id="menuToggle" aria-label="Open controls">☰</button>
  <aside id="sidebar">
    <div class="sidebar-scroll">
      <div class="panel-head">
        <div>
          <div class="state-badge" style="background:rgba(255,255,255,.16);border-color:rgba(255,255,255,.18);color:#fff;">Rebuild <strong id="versionTag">v22.3.24</strong></div>
          <h1>Camping Map</h1>
          <p id="statusLine">Starting up…</p>
          <p id="dataStats" class="mini-note"></p>
        </div>
        <button id="closeSidebar" aria-label="Close panel">✕</button>
      </div>
      <section class="section">
        <h2>Find an area</h2>
        <div class="row"><input id="searchInput" type="text" placeholder="City, park, address, or coordinates"><button id="searchBtn" class="primary" type="button">Go</button></div>
        <div id="searchResults" class="search-results"></div>
      </section>
      <section class="section">
        <h2>Basemap</h2>
        <select id="basemapSelect">
          <option value="topo">Topo</option>
          <option value="opentopo">OpenTopo</option>
          <option value="osm">OpenStreetMap</option>
          <option value="satellite">Satellite</option>
        </select>
        <div class="mini-note" style="margin-top:10px;"></div>
      </section>
      <section class="section">
        <h2>State view</h2>
        <select id="stateSelect"><option value="__ALL__">All mapped states</option></select>
        <div id="stateSelectMeta" class="mini-note" style="margin-top:10px;" hidden></div>
      </section>
      <section class="section">
        <h2>Camping layers</h2>
        <div class="quick-filters" id="layerQuickFilters">
          <button type="button" data-layer-toggle-group="modern">Modern Campgrounds</button>
          <button type="button" data-layer-toggle-group="rustic">Rustic Campgrounds</button>
        </div>
        <div class="dropdown">
          <button id="layerMenuButton" class="dropdown-btn" type="button" aria-expanded="false" aria-controls="layerMenuPanel"><span>Choose camping layers</span><span id="layerMenuSummary" class="summary-note">-- selected</span><span class="caret">▾</span></button>
          <div id="layerMenuPanel" class="dropdown-panel" hidden>
            <div id="layerList" class="toggle-grid"></div>
          </div>
        </div>
      </section>
      <section class="section legend-mobile-wrap">
        <details id="legendPanelMobile" class="legend-mobile">
          <summary>Map legend</summary>
          <div id="mapLegendMobile" class="legend-mobile-body"></div>
        </details>
      </section>
<section class="section">
  <h2>Supabase sync</h2>
  <div id="supabaseStatus" class="mini-note">Static fallback mode.</div>
  <form id="sbAuthForm" class="field-grid" style="margin-top:10px;">
    <div class="row"><input id="sbEmail" type="email" placeholder="Email" autocomplete="username email"><input id="sbPassword" type="password" placeholder="Password" autocomplete="current-password"></div>
    <div class="row wrap"><button id="sbSignInBtn" class="primary" type="submit">Sign in</button><button id="sbSignOutBtn" class="secondary" type="button">Sign out</button></div>
    <label class="check small"><input id="showPendingLayer" type="checkbox"><span>Needs Verification layer</span><span class="meta" id="pendingMeta">off</span></label>
  </form>
</section>
      <section class="section">
        <h2>Add a site</h2>
        <label class="check"><input id="addMode" type="checkbox"><span>Click the map to drop a draft pin</span></label>
        <div class="field-grid" style="margin-top:10px;">
          <div class="mini-note" id="draftCoords">No draft point selected.</div>
          <input id="draftName" type="text" placeholder="Site name">
          <div class="row"><input id="draftState" type="text" maxlength="2" placeholder="State code"><select id="draftCategory"><option value="federal-modern">Federal modern</option><option value="federal-rustic">Federal rustic</option><option value="state-modern">State modern</option><option value="state-rustic">State rustic</option><option value="local-modern">Local modern</option><option value="local-rustic">Local rustic</option><option value="private-modern">Private modern</option><option value="private-rustic">Private rustic</option><option value="boondocking">Boondocking</option><option value="info">Info</option></select></div>
          <input id="draftWebsite" type="url" placeholder="Website URL">
          <textarea id="draftNotes" placeholder="Description / site summary"></textarea>
          <div class="row"><input id="draftCost" type="text" placeholder="Cost / fees"><input id="draftShowers" type="text" placeholder="Showers"></div>
          <input id="draftAccess" type="text" placeholder="Access / road notes (2WD, 4WD, tight turns, etc.)">
          <textarea id="draftAmenities" placeholder="Amenities (vault toilet, pump, hookups, boat launch, etc.)"></textarea>
          <input id="draftTrailheads" type="text" placeholder="Trailheads / nearby activities">
          <input id="draftSeason" type="text" placeholder="Season / closure notes">
          <div class="row"><input id="draftReview" type="text" placeholder="Review summary"><input id="draftRating" type="text" placeholder="Rating (for example 4.3/5)"></div>
          <textarea id="draftExtraLinks" placeholder="Extra links or image links, one per line"></textarea>
          <div class="row wrap"><button id="appendDraftBtn" class="primary" type="button">Append to queue</button><button id="sendDraftSupabaseBtn" class="secondary" type="button">Send to Needs Verification</button><button id="clearDraftBtn" class="secondary" type="button">Clear draft pin</button></div>
        </div>
      </section>
      <section class="section"><h2>Manual site queue</h2><textarea id="draftQueue" readonly></textarea><div class="row wrap" style="margin-top:10px;"><button id="copyQueueBtn" class="secondary" type="button">Copy queue</button><button id="clearQueueBtn" class="secondary" type="button">Clear queue</button></div></section>
    </div>
  </aside>
  <div id="statusBar" hidden></div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="data/states-manifest-v22.3.3.js"></script>
<script src="data/pending-sites-v22.3.3.js"></script>
<script src="config.js"></script>
<script src="app-v22.3.22.js"></script>

    parking:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M6 3h7.4c3 0 5.1 2.1 5.1 5s-2.1 5.1-5.1 5.1H9.6V21H6V3Zm3.6 3.2v3.7h3.4c1.1 0 1.9-.7 1.9-1.9s-.8-1.8-1.9-1.8H9.6Z"/></svg>',
    info:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M12 2.8A9.2 9.2 0 1 1 2.8 12 9.2 9.2 0 0 1 12 2.8Zm0 4a1.3 1.3 0 1 0 0 2.6 1.3 1.3 0 0 0 0-2.6Zm-1.7 5v1.8h1.1v3.6h-1.1V19h4.5v-1.8h-1.1v-5.4h-3.4Z"/></svg>',
    draft:'<svg viewBox="0 0 24 24"><path fill="currentColor" d="M4 17.5V20h2.5l8.6-8.6-2.5-2.5L4 17.5Zm12.4-9.9 1.5-1.5a1.2 1.2 0 0 1 1.7 0l.8.8a1.2 1.2 0 0 1 0 1.7l-1.5 1.5-2.5-2.5Z"/></svg>'
  };
  const iconFor={
    'federal-modern':['pin-federal-modern',SVG.tent],'state-modern':['pin-state-modern',SVG.tent],'local-modern':['pin-local-modern',SVG.tent],
    'federal-rustic':['pin-federal-rustic',SVG.tree],'state-rustic':['pin-state-rustic',SVG.tree],'local-rustic':['pin-local-rustic',SVG.tree],
    'private-modern':['pin-private-modern',SVG.camper],'private-rustic':['pin-private-rustic',SVG.camper],
    'boondocking':['pin-boondocking',SVG.tree],'info':['pin-info',SVG.info],'pending':['pin-draft',SVG.draft],
    'corporate-parking':['pin-corporate-parking',SVG.parking],'rest-truck':['pin-rest-truck',SVG.parking]
  };
  const groups={
    modern:['federal-modern','state-modern','local-modern'],
    rustic:['federal-rustic','state-rustic','local-rustic']
  };
  const $=id=>document.getElementById(id);
  function setVersion(){document.title='Camping Map '+VERSION+' mobile UI cleanup'; const t=$('versionTag'); if(t)t.textContent=VERSION;}
  function refreshHeader(){
    const head=document.querySelector('.panel-head > div'); if(!head || head.dataset.v2424)return; head.dataset.v2424='1';
    const badge=head.querySelector('.state-badge'); const h1=head.querySelector('h1');
    if(h1) h1.innerHTML='Boondocking<br>Camping Map';
    const img=document.createElement('img'); img.className='brand-icon'; img.src='assets/icon-192.png'; img.alt='Camping Map icon';
    const wrap=document.createElement('div'); wrap.className='brand-lockup';
    const text=document.createElement('div');
    if(h1){ h1.parentNode.insertBefore(wrap,h1); wrap.appendChild(img); text.appendChild(h1); const sub=document.createElement('p'); sub.className='brand-sub'; sub.textContent='Public-land camping planner'; text.appendChild(sub); wrap.appendChild(text); }
    if(badge) head.appendChild(badge);
  }
  function hideNotes(){ const n=$('stateSelectMeta'); if(n){n.textContent='';n.hidden=true;} document.querySelectorAll('.mini-note').forEach(el=>{ if(/Recovery build uses/i.test(el.textContent)) el.remove(); }); }
  function syncChecks(keys,on){keys.forEach(k=>{const cb=document.querySelector('[data-layer-toggle="'+k+'"]'); if(cb && cb.checked!==on){cb.checked=on; cb.dispatchEvent(new Event('change',{bubbles:true}));}});}
  function groupState(keys){const cbs=keys.map(k=>document.querySelector('[data-layer-toggle="'+k+'"]').checked).filter(v=>v!==undefined); return cbs.length && cbs.every(Boolean) ? 'on' : cbs.some(Boolean) ? 'partial' : 'off';}
  function makeGroup(key,label,iconCss,svg){
    const row=document.createElement('label'); row.className='check small layer-group-control'; row.dataset.groupControl=key;
    row.innerHTML='<input type="checkbox"><span class="map-pin layer-icon '+iconCss+'">'+svg+'</span><span class="label-text">'+label+'</span><span class="meta"></span>';
    row.querySelector('input').addEventListener('change',e=>syncChecks(groups[key], e.target.checked));
    return row;
  }
  function enhanceLayers(){
    const panel=$('layerMenuPanel'), list=$('layerList'); if(!panel || !list)return;
    if(!panel.querySelector('.layer-select-all')){
      const btn=document.createElement('button'); btn.type='button'; btn.className='primary layer-select-all'; btn.textContent='Select all visible layers';
      btn.addEventListener('click',()=>{document.querySelectorAll('#layerList [data-layer-toggle]').forEach(cb=>{ if(!cb.disabled && !cb.checked){cb.checked=true;cb.dispatchEvent(new Event('change',{bubbles:true}));}});});
      panel.insertBefore(btn,list);
    }
    list.querySelectorAll('label.check').forEach(label=>{
      const cb=label.querySelector('[data-layer-toggle]'); if(!cb)return; const key=cb.getAttribute('data-layer-toggle');
      const dot=label.querySelector('.legend-dot'); const found=iconFor[key];
      if(dot && found){ const span=document.createElement('span'); span.className='map-pin layer-icon '+found[0]; span.innerHTML=found[1]; dot.replaceWith(span); }
      const textSpans=[...label.querySelectorAll('span')].filter(s=>!s.classList.contains('map-pin')&&!s.classList.contains('meta'));
      textSpans.forEach(sp=>sp.classList.add('label-text'));
      if(['federal-modern','state-modern','local-modern','federal-rustic','state-rustic','local-rustic'].includes(key)){ label.style.display='none'; }
    });
    if(!list.querySelector('[data-v24-group-wrap]')){
      const wrap=document.createElement('div'); wrap.dataset.v24GroupWrap='1'; wrap.className='layer-group-grid';
      const title=document.createElement('div'); title.className='layer-group-title'; title.textContent='Combined public campground layers';
      wrap.appendChild(title); wrap.appendChild(makeGroup('modern','Modern campgrounds', 'pin-state-modern', SVG.tent)); wrap.appendChild(makeGroup('rustic','Rustic campgrounds', 'pin-state-rustic', SVG.tree));
      const title2=document.createElement('div'); title2.className='layer-group-title'; title2.textContent='Future parking layers'; wrap.appendChild(title2);
      ['Corporate overnight parking','Rest areas / truck stops'].forEach((txt,i)=>{const row=document.createElement('label'); row.className='check small disabled-layer'; row.innerHTML='<input type="checkbox" disabled><span class="map-pin layer-icon '+(i?'pin-rest-truck':'pin-corporate-parking')+'">'+SVG.parking+'</span><span class="label-text">'+txt+'</span><span class="meta">coming</span>'; wrap.appendChild(row);});
      list.insertBefore(wrap,list.firstChild);
    }
    Object.entries(groups).forEach(([key,keys])=>{ const row=list.querySelector('[data-group-control="'+key+'"]'); if(!row)return; const cb=row.querySelector('input'), meta=row.querySelector('.meta'); const st=groupState(keys); cb.checked=st==='on'; cb.indeterminate=st==='partial'; if(meta)meta.textContent=st==='partial'?'some':(st==='on'?'on':'off'); });
  }
  function addFilters(){
    if($('filterCost'))return; const layers=document.querySelector('#layerQuickFilters')?.closest('.section'); if(!layers)return;
    const sec=document.createElement('section'); sec.className='section'; sec.innerHTML='<h2>Filters</h2><div class="filter-grid"><label>Cost<select id="filterCost"><option value="any">Any cost</option><option value="free">Free</option><option value="10">$10 or less</option><option value="20">$20 or less</option><option value="30">$30 or less</option></select></label><label>Showers<select id="filterShowers"><option value="any">Any</option><option value="yes">Has showers</option><option value="no">No showers / unknown</option></select></label><label>Access<select id="filterAccess"><option value="any">Any access</option><option value="2wd">2WD friendly</option><option value="clearance">High-clearance noted</option><option value="4wd">4WD noted</option><option value="seasonal">Seasonal road noted</option></select></label><label>Amenities<select id="filterAmenities"><option value="any">Any amenities</option><option value="water">Water</option><option value="toilet">Toilet</option><option value="electric">Electric / hookup</option><option value="boat">Boat launch</option></select></label></div><div class="filter-note">Filter controls added in v22.3.24. Full marker filtering is queued for the next app-JS pass so this index-only update does not risk breaking map rendering.</div>';
    layers.after(sec);
  }
  function makeModal(id,title,section){
    const back=document.createElement('div'); back.id=id; back.className='modal-backdrop'; back.innerHTML='<div class="modal-card" role="dialog" aria-modal="true"><div class="modal-head"><h2>'+title+'</h2><button type="button" class="modal-close" aria-label="Close">×</button></div></div>';
    document.getElementById('app').appendChild(back); back.querySelector('.modal-card').appendChild(section);
    back.addEventListener('click',e=>{if(e.target===back)back.classList.remove('open')}); back.querySelector('.modal-close').addEventListener('click',()=>back.classList.remove('open')); return back;
  }
  function setupPopups(){
    const side=document.querySelector('.sidebar-scroll'); if(!side || $('openAddSiteBtn'))return;
    const sections=[...side.querySelectorAll('section.section')];
    const addSec=sections.find(s=>/Add a site/i.test(s.querySelector('h2')?.textContent||''));
    const queueSec=sections.find(s=>/Manual site queue/i.test(s.querySelector('h2')?.textContent||''));
    if(addSec){ const launcher=document.createElement('section'); launcher.className='section section-launch'; launcher.innerHTML='<h2>Add a site</h2><button id="openAddSiteBtn" class="secondary" type="button"><span>Open Add A Site window</span><span>＋</span></button>'; addSec.before(launcher); const modal=makeModal('addSiteModal','Add A Site',addSec); $('openAddSiteBtn').addEventListener('click',()=>modal.classList.add('open')); }
    if(queueSec){ const launcher=document.createElement('section'); launcher.className='section section-launch'; launcher.innerHTML='<h2>Manual site queue</h2><button id="openQueueBtn" class="secondary" type="button"><span>Open Manual Site Queue</span><span>☰</span></button>'; queueSec.before(launcher); const modal=makeModal('queueModal','Manual Site Queue',queueSec); $('openQueueBtn').addEventListener('click',()=>modal.classList.add('open')); }
  }
  function fixPendingRow(){ const p=$('pendingMeta'); if(p)p.textContent=p.textContent||'off'; const lab=$('showPendingLayer')?.closest('label'); if(lab) lab.querySelector('span:not(.meta)')?.classList.add('label-text'); }
  function run(){setVersion(); refreshHeader(); hideNotes(); enhanceLayers(); addFilters(); setupPopups(); fixPendingRow();}
  window.addEventListener('DOMContentLoaded',()=>{run(); setTimeout(run,150); setTimeout(run,700);});
  new MutationObserver(()=>enhanceLayers()).observe(document.documentElement,{childList:true,subtree:true});
})();
</script>

</body>
</html>
